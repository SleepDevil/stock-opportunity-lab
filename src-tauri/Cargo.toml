[package]
name = "stock-opportunity-lab-desktop"
version = "0.1.5"
description = "Desktop client for Stock Opportunity Lab"
authors = ["Stock Opportunity Lab"]
edition = "2024"
rust-version = "1.85"

[lib]
name = "stock_opportunity_lab_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4.33"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSEvent", "NSResponder", "NSTrackingArea", "NSView"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSGeometry", "NSObject"] }
