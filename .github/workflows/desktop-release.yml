name: Publish desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "Unable to read the desktop version from src-tauri/tauri.conf.json" >&2
            exit 1
          fi

          expected_tag="desktop-v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$expected_tag" ]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match desktop version $version (expected $expected_tag)" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish-tauri:
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: app,dmg
          - platform: macos-15-intel
            bundles: app,dmg
          - platform: ubuntu-22.04
            bundles: appimage,deb
          - platform: windows-latest
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install JavaScript dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Install desktop backend dependencies
        run: python -m pip install -e "backend[desktop]"

      - name: Build local API sidecar
        env:
          STOCK_LAB_DESKTOP_PYTHON: python
        run: npm run desktop:sidecar

      - name: Verify updater signing secret
        shell: bash
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_SIGNING_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured" >&2
            exit 1
          fi

      - name: Build signed installers and updater metadata
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: desktop-v__VERSION__
          releaseName: Stock Opportunity Lab v__VERSION__
          releaseBody: Download the installer for your platform. Existing updater-enabled clients will discover this release automatically after it is published.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }}

  finalize-updater-metadata:
    needs:
      - release-metadata
      - publish-tauri
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: desktop-v${{ needs.release-metadata.outputs.version }}
      RELEASE_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - name: Replace API asset URLs with public download URLs
        shell: bash
        run: |
          metadata_dir="${RUNNER_TEMP}/updater-metadata"
          mkdir -p "$metadata_dir"

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern latest.json \
            --dir "$metadata_dir" \
            --clobber

          gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > "$metadata_dir/release.json"

          jq --slurpfile release "$metadata_dir/release.json" '
            ($release[0].assets
              | map({key: (.id | tostring), value: .browser_download_url})
              | from_entries) as $asset_urls
            | .platforms |= with_entries(
                if (.value.url | test("/releases/assets/[0-9]+$")) then
                  (.value.url | capture("/(?<id>[0-9]+)$").id) as $asset_id
                  | .value.url = (
                      $asset_urls[$asset_id]
                      // error("missing release asset for id " + $asset_id)
                    )
                else
                  .
                end
              )
          ' "$metadata_dir/latest.json" > "$metadata_dir/latest.public.json"

          public_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/"
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg prefix "$public_prefix" \
            '
              .version == $version
              and (.platforms | length > 0)
              and ([.platforms[].signature | length > 0] | all)
              and ([.platforms[].url | startswith($prefix)] | all)
            ' \
            "$metadata_dir/latest.public.json" \
            > /dev/null

          cp "$metadata_dir/latest.public.json" "$metadata_dir/latest.json"
          gh release upload "$RELEASE_TAG" \
            "$metadata_dir/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  publish-release:
    if: github.ref_type == 'tag'
    needs:
      - release-metadata
      - finalize-updater-metadata
    runs-on: ubuntu-latest
    steps:
      - name: Publish verified release as latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: desktop-v${{ needs.release-metadata.outputs.version }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest --verify-tag
