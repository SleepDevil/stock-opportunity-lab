services:
  - type: web
    name: stock-opportunity-lab
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: STOCK_LAB_DATA_DIR
        value: /data
      - key: STOCK_LAB_DATABASE_URL
        sync: false
      - key: STOCK_LAB_FEISHU_APP_ID
        sync: false
      - key: STOCK_LAB_FEISHU_APP_SECRET
        sync: false
      - key: STOCK_LAB_WATCHLIST_COMMENTARY_FEISHU_ENABLED
        value: "false"
      - key: STOCK_LAB_WATCHLIST_COMMENTARY_FEISHU_CHAT_ID
        sync: false
      - key: STOCK_LAB_WATCHLIST_COMMENTARY_PLATFORM_URL
        sync: false
      - key: STOCK_LAB_ACCESS_KEY
        sync: false
      - key: STOCK_LAB_AI_PROVIDER
        value: auto
      - key: STOCK_LAB_ZHIPU_API_KEY
        sync: false
      - key: STOCK_LAB_ZHIPU_MODEL
        value: glm-4.7-flash
      - key: PYTHONUNBUFFERED
        value: "1"
